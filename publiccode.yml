description:
  nl:
    shortDescription: >-
      Technische documentatie voor de Generieke Functies van het Ministerie
      van Volksgezondheid, Welzijn en Sport.
    longDescription: |
      Deze repository bevat de technische documentatie voor het GFModules-platform,
      onderdeel van het 'Generieke Functies, lokalisatie en addressering'-project
      van het Ministerie van Volksgezondheid, Welzijn en Sport.

      De documentatie beschrijft de services en integratiepatronen van het
      platform en wordt gepubliceerd als statische website via Hugo en GitHub Pages.
    features:
      - Documentatie van services en integratiepatronen
      - Gepubliceerd als statische Hugo-website via GitHub Pages
  en:
    shortDescription: >-
      Technical documentation for the GFModules platform, published by the
      Dutch Ministry of Health, Welfare and Sport.
    longDescription: |
      This repository contains the technical documentation for the GFModules
      platform, part of the 'Generieke Functies, lokalisatie en addressering'
      project of the Ministry of Health, Welfare and Sport of the Dutch government.

      The documentation covers services and integration patterns for the platform
      and is published as a static site using Hugo and GitHub Pages.
    features:
      - Documentation of services and integration patterns
      - Published as a static Hugo site via GitHub Pages

