{{ define "title" }}{{ .Site.Title }} - {{ .Site.Params.subtitle }}{{ end }}

{{ define "main" }}
<section class="hero">
  <div class="hero-inner">
    <div>
      <h1>{{ .Params.hero_title }}</h1>
      <p class="hero-desc">{{ .Description }}</p>
    </div>
  </div>
</section>

<main class="page-content markdown-content">
  {{ .Content }}
</main>
{{ end }}
