<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ block "title" . }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "assets/css/style.css" | relURL }}">
</head>
<body>

<header class="site-header">
  <nav class="nav-inner" aria-label="Hoofdnavigatie">
    <a class="nav-brand" href="{{ absURL "" }}" aria-label="{{ .Site.Title }}">
      <div class="nav-logo">GF</div>
      <div class="nav-title">{{ .Site.Title }} <span class="nav-sub">{{ .Site.Params.subtitle }}</span></div>
    </a>
    <ul class="nav-links nav-links-desktop">
      {{ partial "nav-links.html" . }}
    </ul>
    <details class="nav-menu">
      <summary class="nav-toggle">
        <span>Menu</span>
        <span class="nav-toggle-icon" aria-hidden="true">☰</span>
      </summary>
      <ul class="nav-links">
        {{ partial "nav-links.html" . }}
      </ul>
    </details>
  </nav>
</header>

{{ block "main" . }}{{ end }}

<footer class="site-footer">
  <div class="footer-inner">
    <span>{{ .Site.Title }}</span>
    <span>Vragen? <a href="mailto:{{ .Site.Params.contact_email }}">{{ .Site.Params.contact_email }}</a></span>
  </div>
</footer>

<script src="{{ "assets/js/main.js" | relURL }}"></script>
</body>
</html>
