{{- $destination := .Destination -}}
{{- if hasPrefix $destination "/" -}}
  {{- if not (hasPrefix $destination "//") -}}
    {{- $destination = strings.TrimPrefix "/" $destination | relURL -}}
  {{- end -}}
{{- end -}}
<a href="{{ $destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}>{{ .Text | safeHTML }}</a>{{- "" -}}
