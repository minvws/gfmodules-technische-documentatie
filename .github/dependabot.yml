# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2

updates:
  - package-ecosystem: github-actions
    directory: / # scans workflows + actions
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: [dependencies, github_actions] # existing label in this repo (underscore)
    commit-message:
      prefix: "deps(actions)"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]
