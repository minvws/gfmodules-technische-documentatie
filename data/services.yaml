- id: prs
  icon: "👤"
  icon_class: icon-prs
  name: PRS
  fullname: Pseudoniemendienst
  version: v0.1.0
  environment: Proeftuin
  env_filter: proeftuin

  base_url: "https://pseudoniemendienst.proeftuin.gf.irealisatie.nl/v0.2/api"
  swagger_url: "https://pseudoniemendienst.proeftuin.gf.irealisatie.nl/v0.2/api/docs"
  base_url_note: "De paden in dit overzicht zijn relatief aan deze OpenAPI-server."
  description: "Pseudoniemendienst voor OPRF-, pseudoniem- en RID-uitwisseling. De endpointlijst volgt PRS OpenAPI v0.1.0."
  security_note: "De PRS OpenAPI declareert een Bearer-token voor de beschermde API-routes. De routes voor service-informatie hebben geen securityvereiste in de specificatie; mTLS wordt alleen algemeen in de API-beschrijving genoemd."
  test_routes_note: "Routes onder /test zijn alleen beschikbaar wanneer test-routes zijn ingeschakeld en zijn niet bestemd voor productiegebruik."
  integration_anchor: prs
  oauth:
    title: "PRS OAuth"
    base_url: "https://pseudoniemendienst.proeftuin.gf.irealisatie.nl/v0.2/oauth"
    swagger_url: "https://pseudoniemendienst.proeftuin.gf.irealisatie.nl/v0.2/oauth/docs"
    target_audience: "https://pseudoniemendienst.proeftuin.gf.irealisatie.nl/v0.2/api"
    organization_id_label: organisatie-ID
    organization_id_example: "<organisatie-id>"
    organization_id_description: "Verplicht formulierveld. Het verwachte formaat wordt niet door de OAuth OpenAPI gespecificeerd."
    default_scope: "prs:read"
    scopes:
      - value: "prs:read"
        description: "Huidige Proeftuin-waarde; de OAuth OpenAPI specificeert geen toegestane scopewaarden."
    contract_note: "De OAuth OpenAPI v0.1.0 specificeert alleen de verplichte formuliervelden grant_type, target_audience, scope en organization_id. Clientauthenticatie, toegestane grant- en scopewaarden, tokenresponse en refreshbeleid staan niet in die specificatie."
    endpoints:
      - method: GET
        path: "/"
        description: "Index"
        auth: "Niet gespecificeerd in OpenAPI"
      - method: GET
        path: "/version.json"
        description: "Versie-informatie"
        auth: "Niet gespecificeerd in OpenAPI"
      - method: GET
        path: "/health"
        description: "Health check"
        auth: "Niet gespecificeerd in OpenAPI"
      - method: GET
        path: "/.well-known/oauth-authorization-server"
        description: "OAuth 2.0 Authorization Server-metadata"
        auth: "Niet gespecificeerd in OpenAPI"
      - method: GET
        path: "/jwks.json"
        description: "OAuth 2.0 JSON Web Key Set"
        auth: "Niet gespecificeerd in OpenAPI"
      - method: POST
        path: "/token"
        description: "Nieuw token aanmaken (application/x-www-form-urlencoded)"
        auth: "Niet gespecificeerd in OpenAPI"
  endpoints:
    - method: GET
      path: "/"
      description: "Servicebanner en versie-informatie"
      auth: "Niet gespecificeerd in OpenAPI"
    - method: GET
      path: "/version.json"
      description: "Serviceversie als JSON"
      auth: "Niet gespecificeerd in OpenAPI"
    - method: GET
      path: "/health"
      description: "Health check"
      auth: "Niet gespecificeerd in OpenAPI"
    - method: POST
      path: "/oprf/eval"
      description: "Evalueer een OPRF-blind en retourneer een versleutelde JWE voor de organisatie"
      auth: "Bearer-token"
    - method: POST
      path: "/receive"
      description: "Ontvang en ontsleutel een RID"
      auth: "Bearer-token"
    - method: POST
      path: "/exchange/rid"
      description: "Wissel een RID uit"
      auth: "Bearer-token"
    - method: POST
      path: "/exchange/pseudonym"
      description: "Wissel een pseudoniem uit"
      auth: "Bearer-token"
    - method: POST
      path: "/administration/register/certificate"
      description: "Registreer publieke-sleutelinformatie voor de geautoriseerde organisatie"
      auth: "Bearer-token"
    - method: GET
      path: "/administration/keys"
      description: "Lijst met publieke-sleutelinformatie voor de geautoriseerde organisatie"
      auth: "Bearer-token"
    - method: PUT
      path: "/administration/keys/{id}"
      description: "Werk een sleutel van de geautoriseerde organisatie bij"
      auth: "Bearer-token"
    - method: DELETE
      path: "/administration/keys/{id}"
      description: "Verwijder een sleutel van de geautoriseerde organisatie"
      auth: "Bearer-token"
    - method: GET
      path: "/administration/key-versions"
      description: "Lijst met HSM-sleutelversies voor de geautoriseerde organisatie"
      auth: "Bearer-token"
    - method: POST
      path: "/administration/key-versions"
      description: "Maak een nieuwe HSM-sleutelversie aan"
      auth: "Bearer-token"
    - method: PUT
      path: "/administration/key-versions/{id}"
      description: "Werk een HSM-sleutelversie bij"
      auth: "Bearer-token"
    - method: POST
      path: "/test/oprf/client"
      description: "Maak een geblindeerde invoer en factor voor een testwaarde"
      auth: "Bearer-token"
      test_only: true
    - method: POST
      path: "/test/oprf/receiver"
      description: "Test het ontsleutelen van de ontvanger met een blind factor"
      auth: "Bearer-token"
      test_only: true
    - method: POST
      path: "/test/jwe/decode"
      description: "Decodeer een JWE met een opgegeven privésleutel"
      auth: "Bearer-token"
      test_only: true
    - method: POST
      path: "/test/pseudonym/reversible"
      description: "Keer een pseudoniem om"
      auth: "Bearer-token"
      test_only: true
    - method: GET
      path: "/test/mtls"
      description: "Geef mTLS-informatie over de aanroepende organisatie terug"
      auth: "Bearer-token"
      test_only: true

