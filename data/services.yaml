- id: prs
  icon: "👤"
  icon_class: icon-prs
  name: PRS
  fullname: Pseudoniemendienst
  version: v0.0.38

  url_placeholder: "<prs-api-url>"
  base_path: "/api"
  base_path_note: "Alle API-paden hieronder staan achter dit basispad."
  description: "Pseudoniemendienst voor OPRF en omkeerbare en niet-omkeerbare pseudoniemen."
  security_note: "Gebruik mTLS en een Bearer-token met de scope voor de gekozen PRS-operatie."
  test_routes_note: "Routes onder /test zijn alleen beschikbaar wanneer test-routes zijn ingeschakeld en zijn uitsluitend bedoeld voor tests."
  integration_anchor: prs
  oauth:
    title: "PRS OAuth"
    url_placeholder: "<prs-oauth-url>"
    base_path: "/oauth"
    target_audience_example: "<prs-api-url>/api"
    organization_id_label: organisatie-ID
    organization_id_example: "<oin>"
    organization_id_description: "Verplicht formulierveld: het OIN van 20 posities van de organisatie waarvoor de client handelt, zonder voorvoegsel."
    default_scope: "prs:oprf-pseudonym"
    scopes:
      - value: "prs:oprf-pseudonym"
        description: "OPRF-evaluatie aanvragen."
      - value: "prs:pseudonym"
        description: "Omkeerbare en niet-omkeerbare pseudoniemen uitwisselen."
      - value: "prs:administration"
        description: "Ontvangersleutels en HSM-sleutelversies beheren."
      - value: "prs:saml-pseudonym"
        description: "Toegang tot de afzonderlijk inschakelbare SAML-testkoppeling."
    contract_note: "Gebruik grant_type, target_audience, scope, organization_external_id en client_id."
    endpoints:
      - method: GET
        path: "/"
        description: "Index"
        auth: "mTLS; geen OAuth-token"
      - method: GET
        path: "/version.json"
        description: "Versie-informatie"
        auth: "mTLS; geen OAuth-token"
      - method: GET
        path: "/health"
        description: "Health check"
        auth: "mTLS; geen OAuth-token"
      - method: GET
        path: "/.well-known/oauth-authorization-server"
        description: "OAuth 2.0 Authorization Server-metadata"
        auth: "mTLS; geen OAuth-token"
      - method: GET
        path: "/jwks.json"
        description: "OAuth 2.0 JSON Web Key Set"
        auth: "mTLS; geen OAuth-token"
      - method: POST
        path: "/token"
        description: "Nieuw token aanmaken (application/x-www-form-urlencoded)"
        auth: "mTLS; geen OAuth-token"
  endpoints:
    - method: GET
      path: "/"
      description: "Servicebanner en versie-informatie"
      auth: "mTLS en OAuth-token"
    - method: GET
      path: "/version.json"
      description: "Serviceversie als JSON"
      auth: "mTLS; geen OAuth-token"
    - method: GET
      path: "/health"
      description: "Health check"
      auth: "mTLS; geen OAuth-token"
    - method: POST
      path: "/oprf/eval"
      description: "Evalueer een OPRF-blind en retourneer een versleutelde JWE voor de organisatie"
      auth: "prs:oprf-pseudonym"
    - method: POST
      path: "/exchange/reversible-pseudonym"
      description: "Maak een omkeerbaar pseudoniem voor de ontvanger (201 application/jwe)"
      auth: "prs:pseudonym"
    - method: POST
      path: "/exchange/irreversible-pseudonym"
      description: "Maak een niet-omkeerbaar pseudoniem voor de ontvanger (201 application/jwe)"
      auth: "prs:pseudonym"
    - method: POST
      path: "/saml-exchange/reversible-pseudonym"
      description: "SAML-testkoppeling; alleen beschikbaar wanneer afzonderlijk ingeschakeld"
      auth: "prs:saml-pseudonym"
    - method: POST
      path: "/administration/keys"
      description: "Registreer een ontvangersleutel met domains en een ondertekende JWS"
      auth: "prs:administration"
    - method: GET
      path: "/administration/keys"
      description: "Lijst met publieke-sleutelinformatie voor de geautoriseerde organisatie"
      auth: "prs:administration"
    - method: PUT
      path: "/administration/keys/{id}"
      description: "Werk een sleutel van de geautoriseerde organisatie bij"
      auth: "prs:administration"
    - method: DELETE
      path: "/administration/keys/{id}"
      description: "Verwijder een sleutel van de geautoriseerde organisatie"
      auth: "prs:administration"
    - method: GET
      path: "/administration/key-versions"
      description: "Lijst met HSM-sleutelversies voor de geautoriseerde organisatie"
      auth: "prs:administration"
    - method: POST
      path: "/administration/key-versions"
      description: "Maak een nieuwe HSM-sleutelversie aan"
      auth: "prs:administration"
    - method: PUT
      path: "/administration/key-versions/{id}"
      description: "Werk een HSM-sleutelversie bij"
      auth: "prs:administration"
    - method: POST
      path: "/test/oprf/client"
      description: "Maak een geblindeerde invoer en factor voor een testwaarde"
      auth: "mTLS en OAuth-token"
      test_only: true
    - method: POST
      path: "/test/oprf/receiver"
      description: "Test het ontsleutelen van de ontvanger met een blind factor"
      auth: "mTLS en OAuth-token"
      test_only: true
    - method: POST
      path: "/test/jwe/decode"
      description: "Decodeer een JWE met een opgegeven privésleutel"
      auth: "mTLS en OAuth-token"
      test_only: true

- id: nvi
  icon: "📑"
  icon_class: icon-nvi
  name: NVI
  fullname: "Nationale Verwijs Index"
  version: v0.2.5-rc.0

  url_placeholder: "<nvi-api-url>"
  base_path: "/api"
  base_path_note: "Alle API-paden hieronder staan achter dit basispad."
  description: "Lokalisatiedienst voor gegevensbeschikbaarheid."
  security_note: "Gebruik mTLS en een OAuth-token met de scope voor de gekozen NVI-operatie."
  integration_anchor: nvi
  oauth:
    title: "NVI OAuth"
    url_placeholder: "<nvi-oauth-url>"
    base_path: "/oauth"
    target_audience_example: "<nvi-api-url>/api"
    organization_id_label: organisatie-ID
    organization_id_example: "<ura>"
    organization_id_description: "Verplicht formulierveld: de URA van de zorgaanbieder waarvoor de client handelt."
    source_id_scopes: "nvi:read, nvi:create en nvi:delete"
    source_id_example: "<bron-id>"
    source_id_description: "Bronidentifier voor brongebonden toegang; vereist bij nvi:read, nvi:create en nvi:delete."
    default_scope: "nvi:read"
    scopes:
      - value: "nvi:read"
        description: "Eigen registraties lezen en doorzoeken."
      - value: "nvi:localize"
        description: "Zorgaanbieders lokaliseren voor een persoon."
      - value: "nvi:create"
        description: "Registraties aanmaken voor de geautoriseerde bron."
      - value: "nvi:delete"
        description: "Registraties van de geautoriseerde bron verwijderen."
    contract_note: "Gebruik grant_type, target_audience, scope, organization_external_id en client_id; voeg source_id toe voor brongebonden toegang."
    endpoints:
      - method: GET
        path: "/"
        description: "Index"
        auth: "mTLS; geen OAuth-token"
      - method: GET
        path: "/version.json"
        description: "Versie-informatie"
        auth: "mTLS; geen OAuth-token"
      - method: GET
        path: "/health"
        description: "Health check"
        auth: "mTLS; geen OAuth-token"
      - method: GET
        path: "/.well-known/oauth-authorization-server"
        description: "OAuth 2.0 Authorization Server-metadata"
        auth: "mTLS; geen OAuth-token"
      - method: GET
        path: "/jwks.json"
        description: "OAuth 2.0 JSON Web Key Set"
        auth: "mTLS; geen OAuth-token"
      - method: POST
        path: "/token"
        description: "Nieuw token aanmaken (application/x-www-form-urlencoded)"
        auth: "mTLS; geen OAuth-token"
  endpoints:
    - method: GET
      path: "/"
      description: "API-index"
      auth: "mTLS en OAuth-token"
    - method: GET
      path: "/version.json"
      description: "Versie-informatie"
      auth: "mTLS; geen OAuth-token"
    - method: GET
      path: "/health"
      description: "Health check"
      auth: "mTLS; geen OAuth-token"
    - method: POST
      path: "/fhir/List"
      description: "Maak een FHIR List-resource aan (application/fhir+json)"
      auth: "nvi:create"
    - method: GET
      path: "/fhir/List"
      description: "Lokaliseer op subject:identifier of doorzoek eigen registraties"
      auth: "nvi:localize of nvi:read, afhankelijk van de zoekparameters"
    - method: DELETE
      path: "/fhir/List"
      description: "Verwijder FHIR List-resources met subject:identifier en source:identifier"
      auth: "nvi:delete"
    - method: GET
      path: "/fhir/List/{id}"
      description: "Haal een FHIR List-resource op aan de hand van id"
      auth: "nvi:read"
    - method: DELETE
      path: "/fhir/List/{id}"
      description: "Verwijder een FHIR List-resource aan de hand van id"
      auth: "nvi:delete"
    - method: POST
      path: "/fhir"
      description: "Verwerk een transaction-Bundle met FHIR List-operaties"
      auth: "Scopes per Bundle-operatie"
    - method: GET
      path: "/fhir/metadata"
      description: "FHIR CapabilityStatement"
      auth: "mTLS en OAuth-token met een NVI-scope"
    - method: GET
      path: "/registrations"
      description: "Lees eigen registraties voor pseudonym en oprf_key"
      auth: "nvi:read"
    - method: POST
      path: "/registrations"
      description: "Registreer pseudonym en oprf_key; bron en URA komen uit het token"
      auth: "nvi:create"
    - method: DELETE
      path: "/registrations"
      description: "Verwijder op pseudonym en oprf_key voor de bron en URA uit het token"
      auth: "nvi:delete"
    - method: POST
      path: "/localize"
      description: "Lokaliseer met pseudonym en oprf_key"
      auth: "nvi:localize"
